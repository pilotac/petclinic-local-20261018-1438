version: v1
name: petclinic-local-20261018-1438
traceability:
  mode: warn
release_naming:
  format: semver-v-strict
  mapping: R1
stages:
  planning:
    require_milestone: true
    require_issues_assigned: true
  development:
    branch: main
    deploy_target: dev
    required_checks:
      - build (17)
    required_reviewers:
      min_approvals: 1
  testing:
    branch_pattern: release/**
    required_checks:
      - build (17)
    required_reviewers:
      min_approvals: 1
  evidencing:
    required_reviewers:
      min_approvals: 1
  deployment:
    target: production
    workflow_dispatch:
      workflow: .github/workflows/deploy-prod.yml
      ref: main
      inputs:
        release_version: "{{release_version}}"
        candidate_sha: "{{candidate_sha}}"
    required_checks: []
    promotion: manual
    requires_evidence_approval: true
